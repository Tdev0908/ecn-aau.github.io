- date: 11. December 2025
  title: "Michele Zanitti presents paper at IEEE BigData '25"
  url: "https://conferences.cis.um.edu.mo/ieeebigdata2025/detailed_program.html"
  author: "S. Kosta"
  image: michele-big-data.jpg
  excerpt:
    "
    Michele Zanitti presented the paper, “A Contrastive Variational Autoencoder for NSCLC Survival Prediction with Missing Modalities”, Michele Zanitti, Vanja Miskovic, Francesco Trovò, Alessandra Laura Giulia Pedrocchi, Ming Shen, Yan Kyaw Tun, Arsela Prelaj, and Sokol Kosta. <br><br>

    In collaboration with Aalborg University, Politecnico di Milano, and the Istituto Nazionale dei Tumori (Milan), we tackled the ubiquitous challenge of missing modalities in multimodal learning, with a particular focus on lung cancer prognosis. Our motivation was to develop robust models under incomplete modality conditions.<br><br>

    The participation was supported by the HEU project <a href='/projects/i3lung'>I3LUNG</a>, the travel grants from the Otto Mønsted Foundation Denmark, and IEEE BigData.<br><br>
"

