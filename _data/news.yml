  image: summer_school_group_pic.JPG
  excerpt: "Had an amazing opportunity to attend the 3rd CINI HPC 2025 International Summer School in Naples 🇮🇹, from June 16 - 20. <br>
            It was an incredible week of learning, exploring, and connecting with brilliant people from around the world. Some key highlights for me: <br>
