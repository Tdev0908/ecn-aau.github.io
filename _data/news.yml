- date: 16. June 2025
  title: "3rd CINI HPC Summer school program, Naples(Italy)"
  url: "https://www.linkedin.com/posts/darshan-k-t-70795012b_hpcsummerschool-gpuprogramming-supercomputing-activity-7343983912743751681-ofio?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAB__dPcB4oP6ad-TkEC0-OpAb0jTYcgeizA"
  author: "Darshan Kadiluvagilu Thimme Gowda"
  image: summer_school_group_pic.JPG
  excerpt: "Had an amazing opportunity to attend the 3rd CINI HPC 2025 International Summer School in Naples 🇮🇹, from June 16 - 20. <br>
            It was an incredible week of learning, exploring, and connecting with brilliant people from around the world. Some key highlights for me: <br>
            --Deep dives into HPC systems and CUDA programming. <br>
            --Hands-on sessions with real-world tools and technologies. <br>
            --Exploring the role of High-Performance Computing in science, industry, and society. <br>
            Huge thanks to the organizers, speakers, and everyone behind the scenes for putting together such a well-run and inspiring event. And a special thanks to Associate Professor Sokol Kosta and the CLEVER-project for supporting my participation. "

- date: 13. December 2024
  title: "IEEE ComSoc Outstanding Young Researcher Award for Europe, Middle East, & Africa (EMEA) Region"
  url: "https://emea.regions.comsoc.org/emea-regional-awards/emea-regional-award-winners/"
  author: "Yan Kyaw Tun"
  image: IEEE-Viet.png
  excerpt: "This award honors researchers who have been very active in the IEEE through ComSoc publication and conference activities over the last three years.<br>
      The upper age limit is 35.<br>
    Applicants must be an IEEE member, and resident in the EMEA Region.<br>
    The \"IEEE ComSoc Young Researcher Award for the EMEA Region\" is awarded to the best candidate."

